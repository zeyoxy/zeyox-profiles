<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Connexion — Zeyox Profiles</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="center shell-small">
    <section class="card form-card">
      <a class="back" href="/">← Accueil</a>
      <h1 id="title">Connexion</h1>
      <p id="subtitle" class="muted">Connecte-toi à ton profil.</p>
      <form id="authForm">
        <label>Pseudo<input id="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" /></label>
        <label>Email<input id="email" type="email" autocomplete="email" required /></label>
        <label>Mot de passe<input id="password" type="password" autocomplete="current-password" required minlength="8" /></label>
        <button class="btn primary full" type="submit">Continuer</button>
      </form>
      <div id="msg" class="msg" hidden></div>
      <p class="switch"><span id="switchText">Pas encore de compte ?</span> <a id="switchLink" href="/auth.html?mode=register">Créer un compte</a></p>
    </section>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
